# 1. FILE CẤU HÌNH NGINX SERVER BLOCK (Lưu tại: /etc/nginx/sites-available/my-web hoặc /etc/nginx/conf.d/my-web.conf)

server {
    listen 80;
    server_name _;

    root /var/www/my-web/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cấu hình trang thông báo lỗi 404 tùy chỉnh
    error_page 404 /404.html;

    # Cấu hình location bảo mật cho file 404.html
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }
}


<!-- 
2. NỘI DUNG TỆP TIN 404.html (Lưu tại: /var/www/my-web/html/404.html)
-->

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
            padding-top: 100px;
        }
        h1 {
            font-size: 80px;
            margin: 0;
            color: #dc3545;
        }
        p {
            font-size: 20px;
            margin-top: 10px;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <h2>Trang không tồn tại</h2>
    <p>Rất tiếc, đường dẫn bạn truy cập không hợp lệ hoặc đã bị di chuyển.</p>
    <p><a href="/">Quay về trang chủ</a></p>
</body>
</html>